<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Agon embed demo (IDE flow)</title>
<style>
  body { background:#222; color:#ddd; font-family:monospace; margin:0; display:flex; height:100vh; }
  #left { flex:1; display:flex; flex-direction:column; padding:10px; gap:8px; }
  #editor { flex:1; background:#111; color:#8f8; border:1px solid #555; font-family:monospace; font-size:14px; padding:8px; }
  button { font-family:monospace; font-size:16px; padding:8px; background:#363; color:#fff; border:none; cursor:pointer; }
  #right { flex:1.2; border-left:2px solid #555; }
  iframe { width:100%; height:100%; border:0; }
  #log { height:80px; overflow-y:auto; font-size:11px; color:#7a7; white-space:pre; }
</style>
</head>
<body>
  <div id="left">
    <b>BBC BASIC program (the "IDE editor")</b>
    <textarea id="editor" spellcheck="false">10 MODE 2
20 FOR I=1 TO 500
30 GCOL 0,RND(63)
40 PLOT 69,RND(1280),RND(1024)
50 NEXT
60 PRINT TAB(10,5);"HELLO FROM THE IDE"
</textarea>
    <button id="run">Run in emulator</button>
    <div id="log"></div>
  </div>
  <div id="right">
    <iframe id="emu" src="embed.html"></iframe>
  </div>

<script>
const emu = document.getElementById('emu');
const logEl = document.getElementById('log');
const log = m => { logEl.textContent += m + '\n'; logEl.scrollTop = 1e9; };
let ready = false;

window.addEventListener('message', e => {
  if (!e.data) return;
  if (e.data.type === 'agon-log') log(e.data.msg);
  if (e.data.type === 'agon-ready') { ready = true; log('emulator ready'); }
});

document.getElementById('run').addEventListener('click', () => {
  const src = document.getElementById('editor').value;
  emu.contentWindow.postMessage({
    type: 'agon-run',
    files: [{ path: 'demos/ide.bas', data: src }],
    command: 'bin/basic demos/ide.bas',
  }, '*');
  log(ready ? 'sent program to emulator' : 'queued (emulator still booting)');
});
</script>
</body>
</html>
