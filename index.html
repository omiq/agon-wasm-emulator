<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Agon emulator wasm</title>
<style>
  body { background:#222; color:#ddd; font-family:monospace; text-align:center; }
  canvas { border:2px solid #555; image-rendering:pixelated; background:#000; }
  #log { white-space:pre-wrap; text-align:left; margin:1em auto; max-width:640px; font-size:12px; color:#8f8; }
  #files { margin:0.5em; }
  #files input, #files button { font-family:monospace; background:#333; color:#ddd; border:1px solid #555; padding:2px 6px; }
</style>
</head>
<body>
  <h1>Agon (eZ80 + VDP) in wasm</h1>
  <canvas id="screen" width="640" height="480" tabindex="0"></canvas>
  <div id="files">
    <input type="file" id="upload" multiple>
    <input type="text" id="dlpath" placeholder="path on sdcard, e.g. demos/cube.bas" size="34">
    <button id="download">download</button>
    <button id="list">list sdcard</button>
  </div>
  <div id="log"></div>

<script src="vdp.js"></script>
<script src="cpu.js"></script>
<script src="agon-emulator.js"></script>
<script>
const logEl = document.getElementById('log');
const log = m => { logEl.textContent += m + '\n'; console.log(m); };
const canvas = document.getElementById('screen');

startAgon({
  canvas,
  sdFiles: [
    { path: 'bin/bbcbasic.bin', url: 'fab-agon-emulator/sdcard/bin/bbcbasic.bin' },
    { path: 'bin/basic.bin', url: 'assets/bin/basic.bin' },
    { path: 'demos/fireworks.bas', url: 'fab-agon-emulator/sdcard/demos/fireworks.bas' },
    { path: 'demos/cube.bas', url: 'fab-agon-emulator/sdcard/demos/cube.bas' },
    { path: 'demos/life_2.bas', url: 'fab-agon-emulator/sdcard/demos/life_2.bas' },
  ],
  onLog: log,
}).then(api => {
  globalThis.agon = api;
  canvas.focus();
  log('click the screen to type. try: bin/bbcbasic demos/fireworks.bas');

  document.getElementById('upload').addEventListener('change', async e => {
    for (const f of e.target.files) {
      api.writeFile(f.name, new Uint8Array(await f.arrayBuffer()));
      log('uploaded: /sdcard/' + f.name);
    }
    e.target.value = '';
    canvas.focus();
  });

  document.getElementById('download').addEventListener('click', () => {
    const path = document.getElementById('dlpath').value.trim().replace(/^\/?(sdcard\/)?/, '');
    if (!path) return;
    let bytes;
    try { bytes = api.cpu.FS.readFile('/sdcard/' + path); }
    catch (err) { log('download failed: no such file /sdcard/' + path); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes]));
    a.download = path.split('/').pop();
    a.click();
    URL.revokeObjectURL(a.href);
    log('downloaded: /sdcard/' + path + ' (' + bytes.length + ' bytes)');
  });

  document.getElementById('list').addEventListener('click', () => {
    const walk = dir => {
      for (const name of api.cpu.FS.readdir(dir)) {
        if (name === '.' || name === '..') continue;
        const full = dir + '/' + name;
        const st = api.cpu.FS.stat(full);
        if (api.cpu.FS.isDir(st.mode)) walk(full);
        else log(full + ' (' + st.size + ' bytes)');
      }
    };
    walk('/sdcard');
  });
}).catch(e => log('FATAL: ' + (e && (e.message || String(e)))));
</script>
</body>
</html>
